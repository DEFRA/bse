trigger: none

pool:
  name: DEFRA-COMMON-UBUNTU-SSV3

steps:
  - script: |
      set -x
      curl -sSL --fail --max-time 30 \
        -o sqlcmd.tar.bz2 \
        https://github.com/microsoft/go-sqlcmd/releases/download/v1.8.2/sqlcmd-linux-amd64.tar.bz2 \
        && tar -xjf sqlcmd.tar.bz2 \
        && ./sqlcmd --version
    displayName: 'Fetch and test sqlcmd'
