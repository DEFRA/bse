trigger: none

pool:
  name: DEFRA-COMMON-UBUNTU-SSV3

steps:
  - task: AzureCLI@2
    displayName: 'Find SQL server'
    inputs:
      azureSubscription: 'AZR-BSE-DEV1'
      scriptType: 'bash'
      scriptLocation: 'inlineScript'
      inlineScript: |
        echo "--- servers in subscription ---"
        az sql server list -o table
        echo "--- databases per server ---"
        for s in $(az sql server list --query "[].name" -o tsv); do
          rg=$(az sql server list --query "[?name=='$s'].resourceGroup" -o tsv)
          echo "== $s ($rg) =="
          az sql db list --server "$s" -g "$rg" --query "[].name" -o tsv
        done
