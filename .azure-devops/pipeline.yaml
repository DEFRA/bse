  condition: and(in(dependencies.TST.result, 'Succeeded', 'Skipped'), eq('${{ parameters.deployToPreProd }}', true))
  variables:
    - name: appName
      value: 'PREBSEWEBAW1401'
    - name: tenantId
      value: 'TBD'
    - name: appId
      value: 'TBD'
    - name: sqlServer
