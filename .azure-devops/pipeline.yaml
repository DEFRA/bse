trigger:
  branches:
    include:
      - develop

parameters:
  - name: deployToDev
    displayName: Deploy to DEV
    type: boolean
    default: true

  - name: deployToTest
    displayName: Deploy to TST
    type: boolean
    default: false

  - name: deployToPreProd
    displayName: Deploy to PRE
    type: boolean
    default: false

  - name: runSonar
    displayName: Run SonarCloud analysis
    type: boolean
    default: false

  - name: sonarServiceConnection
    type: string
    default: 'SonarCloud-BSE'  

variables:
  - name: buildConfiguration
    value: 'Release'

  - name: solution
    value: 'src/BSE.slnx'

  - name: webProject
    value: 'src/BSE.Host/BSE.Host.csproj'
  - name: databaseScriptsPath
    value: 'src/Database'

stages:

- stage: Build
  displayName: Build and Test
  jobs:
  - job: build
    pool:
      vmImage: 'ubuntu-24.04'
    steps:

    - checkout: self
      fetchDepth: 0
      persistCredentials: false

    - task: UseDotNet@2
      displayName: 'Install .NET SDK'
      inputs:
        packageType: sdk
        version: '10.0.x'
  

    - ${{ if eq(parameters.runSonar, true) }}:
      - task: SonarCloudPrepare@4
        displayName: 'Prepare Sonar analysis'
        condition: ne(variables['Build.Reason'], 'PullRequest')
        inputs:
          SonarCloud: ${{ parameters.sonarServiceConnection }}
          organization: 'defra'
          scannerMode: 'dotnet'
          projectKey: 'DEFRA_bse'
          projectName: 'BSE'
          extraProperties: |
            sonar.cs.opencover.reportsPaths=$(Agent.TempDirectory)/**/coverage.opencover.xml

    - script: dotnet restore $(solution)
      displayName: 'Restore dependencies'

    - script: dotnet build $(solution) --configuration $(buildConfiguration) --no-restore
      displayName: 'Build'

    - script: dotnet test $(solution) --configuration $(buildConfiguration) --no-build --logger trx --collect:"XPlat Code Coverage" --results-directory $(Agent.TempDirectory) -- DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.Format=opencover
      displayName: 'Run tests with code coverage'

    - task: PublishTestResults@2
      displayName: 'Publish test results'
      condition: succeededOrFailed()
      inputs:
        testResultsFormat: VSTest
        testResultsFiles: '**/*.trx'

    - task: DotNetCoreCLI@2
      displayName: 'Publish BSE.Host'
      inputs:
        command: publish
        publishWebProjects: false
        projects: '$(webProject)'
        arguments: '--configuration $(buildConfiguration) --output $(Build.ArtifactStagingDirectory)'
        zipAfterPublish: true

    - task: CopyFiles@2
      displayName: 'Stage SQL scripts'
      inputs:
        sourceFolder: 'src/Database'
        contents: '**/*.sql'
        targetFolder: '$(Build.ArtifactStagingDirectory)/sql'
        flattenFolders: false
        
    - bash: |
        set -euo pipefail

        # Detect whether any file under the database scripts path (src/Database �
        # covering Deploy/, Migrations/, StoredProcedures/) changed, so downstream
        # deployment stages can skip applying database scripts when there are no
        # script changes to deploy.
        if [ "$(Build.Reason)" = "PullRequest" ]; then
          DIFF_RANGE="origin/$(System.PullRequest.TargetBranch)...HEAD"
        else
          DIFF_RANGE="HEAD~1...HEAD"
        fi

        echo "Checking for database script changes using range: $DIFF_RANGE"

        if git diff --name-only $DIFF_RANGE -- $(databaseScriptsPath) | grep -q .; then
          echo "Database script changes detected under $(databaseScriptsPath):"
          git diff --name-only $DIFF_RANGE -- $(databaseScriptsPath)
          echo "##vso[task.setvariable variable=dbScriptsChanged;isOutput=true]true"
        else
          echo "No database script changes detected under $(databaseScriptsPath)."
          echo "##vso[task.setvariable variable=dbScriptsChanged;isOutput=true]false"
        fi
      name: detectDbChanges
      displayName: 'Detect database script changes'

    - publish: '$(Build.ArtifactStagingDirectory)'
      artifact: drop
      displayName: 'Publish artifact'

    - ${{ if eq(parameters.runSonar, true) }}:
      - task: SonarCloudAnalyze@4
        displayName: 'Run Sonar analysis'
        condition: and(succeededOrFailed(), ne(variables['Build.Reason'], 'PullRequest'))

      - task: SonarCloudPublish@4
        displayName: 'Publish quality gate result'
        condition: and(succeededOrFailed(), ne(variables['Build.Reason'], 'PullRequest'))
        inputs:
          pollingTimeoutSec: '300'

- stage: DEV
  displayName: DEV
  dependsOn: Build
  condition: and(in(dependencies.Build.result, 'Succeeded'), eq('${{ parameters.deployToDev }}', true))
  variables:
    - name: appName
      value: 'DEVBSEWEBAW1401'
    - name: tenantId
      value: '770a2450-0227-4c62-90c7-4e38537f1102'
    - name: appId
      value: '3eeeb482-eea0-4bb5-85a9-9a6fefb27a23'
    - name: sqlServer
      value: 'devbseinfsq1401.database.windows.net,1433'
    - name: sqlServerHost
      value: 'devbseinfsq1401.database.windows.net'  
    - name: dbName
      value: 'BSE'
    - name: msGraphClientId
      value: '3eeeb482-eea0-4bb5-85a9-9a6fefb27a23'
    - name: msGraphSender
      value: 'tse.queries@apha.gov.uk'
    - name: dbScriptsChanged
      value: $[ stageDependencies.Build.build.outputs['detectDbChanges.dbScriptsChanged'] ]
  jobs:
  - deployment: deploy_dev
    environment: 'DEV'
    pool:
      name: 'DEFRA-COMMON-UBUNTU-SSV3'
    strategy:
      runOnce:
        deploy:
          steps:
          - download: current
            artifact: drop

          - script: |
              if [ "$(dbScriptsChanged)" = "true" ]; then
                echo "Database script changes detected � database deployment WILL be applied for DEV."
              else
                echo "No database script changes detected � database deployment WILL BE SKIPPED for DEV."
              fi
            displayName: 'Log database deployment decision'

          - task: AzureCLI@2
            displayName: 'Apply database scripts'
            condition: and(succeeded(), eq(variables['dbScriptsChanged'], 'true'))
            inputs:
              azureSubscription: 'AZR-BSE-DEV1'
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                set -euo pipefail

                TOOLS="$(Agent.TempDirectory)/sqlcmd"
                mkdir -p "$TOOLS"
                curl -sSL --fail --max-time 60 -o "$TOOLS/sqlcmd.tar.bz2" \
                  https://github.com/microsoft/go-sqlcmd/releases/download/v1.8.2/sqlcmd-linux-amd64.tar.bz2
                tar -xjf "$TOOLS/sqlcmd.tar.bz2" -C "$TOOLS"

                DEPLOY_DIR="$(Pipeline.Workspace)/drop/sql/Deploy"
                if [ ! -f "$DEPLOY_DIR/Deploy.sql" ]; then
                  echo "##vso[task.logissue type=error]Deploy.sql not found in $DEPLOY_DIR"
                  exit 1
                fi

                cd "$DEPLOY_DIR"
                echo "Applying Deploy.sql"
                "$TOOLS/sqlcmd" -S "$(sqlServerHost)" -d "$(dbName)" \
                  --authentication-method ActiveDirectoryAzCli \
                  -i Deploy.sql -b -t 0
                  
          - task: AzureWebApp@1
            inputs:
              azureSubscription: 'AZR-BSE-DEV1'
              appType: 'webAppLinux'
              appName: '$(appName)'
              package: '$(Pipeline.Workspace)/drop/*.zip'
              runtimeStack: 'DOTNETCORE|10.0'
              deploymentMethod: 'zipDeploy'
              appSettings: >-
                -Saml2__SPEntityId "https://dev-bse.azure.defra.cloud"
                -Saml2__PublicOrigin "https://dev-bse.azure.defra.cloud"
                -Saml2__IdPEntityId "https://sts.windows.net/$(tenantId)/"
                -Saml2__IdPMetadataUrl "https://login.microsoftonline.com/$(tenantId)/federationmetadata/2007-06/federationmetadata.xml?appid=$(appId)"
                -Authentication__BypassEnabled "false"
                -ConnectionStrings__BSE "Server=tcp:$(sqlServer);Database=$(dbName);Encrypt=True;TrustServerCertificate=False;Connection Timeout=30;Authentication=Active Directory Managed Identity;"
                -AdnsMsGraph__MsGraphTenantId "$(tenantId)"
                -AdnsMsGraph__MsGraphClientId "$(msGraphClientId)"
                -AdnsMsGraph__MsGraphSenderUserId "$(msGraphSender)"
                -AdnsMsGraph__FromAddress "$(msGraphSender)"
- stage: TST
  displayName: TST
  dependsOn: DEV
  condition: and(in(dependencies.DEV.result, 'Succeeded', 'Skipped'), eq('${{ parameters.deployToTest }}', true))
  variables:
    - name: appName
      value: 'TSTBSEWEBAW1401'
    - name: tenantId
      value: '770a2450-0227-4c62-90c7-4e38537f1102'
    - name: appId
      value: '831094e6-109b-4555-b73f-c49e07d2d5d3'
    - name: sqlServer
      value: 'tstbseinfsq1401.database.windows.net,1433'
    - name: sqlServerHost
      value: 'tstbseinfsq1401.database.windows.net'
    - name: dbName
      value: 'BSE'
    - name: dbScriptsChanged
      value: $[ stageDependencies.Build.build.outputs['detectDbChanges.dbScriptsChanged'] ]
    - name: msGraphSenderUserId
      value: 'tse.queries@apha.gov.uk'
    - name: msGraphFromAddress
      value: 'tse.queries@apha.gov.uk'
  jobs:
  - deployment: deploy_test
    environment: 'TST'
    pool:
      name: 'DEFRA-COMMON-UBUNTU-SSV3'
    strategy:
      runOnce:
        deploy:
          steps:
          - download: current
            artifact: drop

          - script: |
              if [ "$(dbScriptsChanged)" = "true" ]; then
                echo "Database script changes detected � database deployment WILL be applied for DEV."
              else
                echo "No database script changes detected � database deployment WILL BE SKIPPED for DEV."
              fi
            displayName: 'Log database deployment decision'

          - task: AzureCLI@2
            displayName: 'Apply database scripts'
            condition: and(succeeded(), eq(variables['dbScriptsChanged'], 'true'))
            inputs:
              azureSubscription: 'AZR-BSE-TST1'
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                set -euo pipefail

                TOOLS="$(Agent.TempDirectory)/sqlcmd"
                mkdir -p "$TOOLS"
                curl -sSL --fail --max-time 60 -o "$TOOLS/sqlcmd.tar.bz2" \
                  https://github.com/microsoft/go-sqlcmd/releases/download/v1.8.2/sqlcmd-linux-amd64.tar.bz2
                tar -xjf "$TOOLS/sqlcmd.tar.bz2" -C "$TOOLS"

                DEPLOY_DIR="$(Pipeline.Workspace)/drop/sql/Deploy"
                if [ ! -f "$DEPLOY_DIR/Deploy.sql" ]; then
                  echo "##vso[task.logissue type=error]Deploy.sql not found in $DEPLOY_DIR"
                  exit 1
                fi

                cd "$DEPLOY_DIR"
                echo "Applying Deploy.sql"
                "$TOOLS/sqlcmd" -S "$(sqlServerHost)" -d "$(dbName)" \
                  --authentication-method ActiveDirectoryAzCli \
                  -i Deploy.sql -b -t 0

          - task: AzureWebApp@1
            inputs:
              azureSubscription: 'AZR-BSE-TST1'
              appType: 'webAppLinux'
              appName: '$(appName)'
              package: '$(Pipeline.Workspace)/drop/*.zip'
              runtimeStack: 'DOTNETCORE|10.0'
              deploymentMethod: 'zipDeploy'
              appSettings: >-
                -Saml2__SPEntityId "https://tst-bse.azure.defra.cloud"
                -Saml2__PublicOrigin "https://tst-bse.azure.defra.cloud"
                -Saml2__IdPEntityId "https://sts.windows.net/$(tenantId)/"
                -Saml2__IdPMetadataUrl "https://login.microsoftonline.com/$(tenantId)/federationmetadata/2007-06/federationmetadata.xml?appid=$(appId)"
                -Authentication__BypassEnabled "false"
                -ConnectionStrings__BSE "Server=tcp:$(sqlServer);Database=$(dbName);Encrypt=True;TrustServerCertificate=False;Connection Timeout=30;Authentication=Active Directory Managed Identity;"
                -AdnsMsGraph__MsGraphTenantId "$(tenantId)"
                -AdnsMsGraph__MsGraphClientId "$(appId)"
                -AdnsMsGraph__MsGraphSenderUserId "$(msGraphSenderUserId)"
                -AdnsMsGraph__FromAddress "$(msGraphFromAddress)"

- stage: PRE
  displayName: PRE
  dependsOn:
  - Build
  - TST
  condition: >-
    and(
      eq(dependencies.Build.result, 'Succeeded'),
      in(dependencies.TST.result, 'Succeeded', 'Skipped'),
      eq('${{ parameters.deployToPreProd }}', true)
    )
  variables:
    - name: appName
      value: 'PREBSEWEBAW1401'
    - name: tenantId
      value: '770a2450-0227-4c62-90c7-4e38537f1102'
    - name: appId
      value: 'b5bd1613-6e97-466b-b5aa-dfce852f8268'
    - name: sqlServer
      value: 'prebseinfsq1401.database.windows.net,1433'
    - name: sqlServerHost
      value: 'prebseinfsq1401.database.windows.net'
    - name: dbName
      value: 'BSE'
    - name: dbScriptsChanged
      value: $[ stageDependencies.Build.build.outputs['detectDbChanges.dbScriptsChanged'] ]
  jobs:
  - deployment: deploy_preprod
    environment: 'PRE'
    pool:
      name: 'DEFRA-COMMON-UBUNTU-SSV5'
    strategy:
      runOnce:
        deploy:
          steps:
          - download: current
            artifact: drop

          - task: AzureCLI@2
            displayName: 'Check plan is zone redundant'
            inputs:
              azureSubscription: 'AZR-BSE-PRE1'
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                set -euo pipefail

                PLAN_ID=$(az webapp list --query "[?name=='$(appName)'].serverFarmId | [0]" -o tsv)

                if [ -z "$PLAN_ID" ]; then
                  echo "##vso[task.logissue type=error]Could not find $(appName) or its App Service Plan in this subscription."
                  exit 1
                fi

                ZR=$(az resource show --ids "$PLAN_ID" --query "properties.zoneRedundant" -o tsv)
                CAP=$(az appservice plan show --ids "$PLAN_ID" --query "sku.capacity" -o tsv)
                SKU=$(az appservice plan show --ids "$PLAN_ID" --query "sku.name" -o tsv)

                echo "Plan: ${PLAN_ID##*/}  SKU: $SKU  instances: $CAP  zoneRedundant: $ZR"

                if [ "${ZR,,}" != "true" ]; then
                  echo "##vso[task.logissue type=error]App Service Plan ${PLAN_ID##*/} is not zone redundant. Refusing to deploy to $(appName)."
                  exit 1
                fi

                if [ "$CAP" -lt 2 ]; then
                  echo "##vso[task.logissue type=error]Zone-redundant plan has fewer than 2 instances."
                  exit 1
                fi

          - script: |
              if [ "$(dbScriptsChanged)" = "true" ]; then
                echo "Database script changes detected - database deployment WILL be applied for PRE."
              else
                echo "No database script changes detected - database deployment WILL BE SKIPPED for PRE."
              fi
            displayName: 'Log database deployment decision'

          - task: AzureCLI@2
            displayName: 'Apply database scripts'
            condition: and(succeeded(), eq(variables['dbScriptsChanged'], 'true'))
            inputs:
              azureSubscription: 'AZR-BSE-PRE1'
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                set -euo pipefail

                TOOLS="$(Agent.TempDirectory)/sqlcmd"
                mkdir -p "$TOOLS"
                curl -sSL --fail --max-time 60 -o "$TOOLS/sqlcmd.tar.bz2" \
                  https://github.com/microsoft/go-sqlcmd/releases/download/v1.8.2/sqlcmd-linux-amd64.tar.bz2
                tar -xjf "$TOOLS/sqlcmd.tar.bz2" -C "$TOOLS"

                DEPLOY_DIR="$(Pipeline.Workspace)/drop/sql/Deploy"
                if [ ! -f "$DEPLOY_DIR/Deploy.sql" ]; then
                  echo "##vso[task.logissue type=error]Deploy.sql not found in $DEPLOY_DIR"
                  exit 1
                fi

                cd "$DEPLOY_DIR"
                echo "Applying Deploy.sql"
                "$TOOLS/sqlcmd" -S "$(sqlServerHost)" -d "$(dbName)" \
                  --authentication-method ActiveDirectoryAzCli \
                  -i Deploy.sql -b -t 0

          - task: AzureWebApp@1
            inputs:
              azureSubscription: 'AZR-BSE-PRE1'
              appType: 'webAppLinux'
              appName: '$(appName)'
              package: '$(Pipeline.Workspace)/drop/*.zip'
              runtimeStack: 'DOTNETCORE|10.0'
              deploymentMethod: 'zipDeploy'
              appSettings: >-
                -Saml2__SPEntityId "https://pre-bse.azure.defra.cloud"
                -Saml2__PublicOrigin "https://pre-bse.azure.defra.cloud"
                -Saml2__IdPEntityId "https://sts.windows.net/$(tenantId)/"
                -Saml2__IdPMetadataUrl "https://login.microsoftonline.com/$(tenantId)/federationmetadata/2007-06/federationmetadata.xml?appid=$(appId)"
                -Authentication__BypassEnabled "false"
                -ConnectionStrings__BSE "Server=tcp:$(sqlServer);Database=$(dbName);Encrypt=True;TrustServerCertificate=False;Connection Timeout=30;Authentication=Active Directory Managed Identity;"
                
