trigger: none
pr: none

parameters:
  - name: vaultName
    type: string
    default: 'DEVBSEINFKV1401'
  - name: secretName
    type: string
    default: 'AdnsMsGraph--MsGraphClientSecret'

pool:
  name: 'DEFRA-COMMON-UBUNTU-SSV3'

steps:
- task: AzureCLI@2
  displayName: 'Set Key Vault secret'
  inputs:
    azureSubscription: 'AZR-BSE-DEV1'
    scriptType: bash
    scriptLocation: inlineScript
    inlineScript: |
      set -euo pipefail

      if [ -z "${SECRET_VALUE:-}" ]; then
        echo "SECRET_VALUE is empty - set it as a secret variable at queue time"
        exit 1
      fi

      az keyvault secret set \
        --vault-name "${{ parameters.vaultName }}" \
        --name "${{ parameters.secretName }}" \
        --value "$SECRET_VALUE" \
        --output none

      echo "Secret written. Current version:"
      az keyvault secret show \
        --vault-name "${{ parameters.vaultName }}" \
        --name "${{ parameters.secretName }}" \
        --query "{name:name, version:id, enabled:attributes.enabled, updated:attributes.updated}" \
        -o table
  env:
    SECRET_VALUE: $(msGraphClientSecret)